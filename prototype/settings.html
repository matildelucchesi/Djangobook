<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Settings</title>
    <link href="css/settings.css" rel="stylesheet" type="text/css">
    <script type="text/javascript" src="main.js"></script>
</head>
<body>
    <header class="header">
        <div class="wrapper">
            <div class="back-arrow">
                <a class="back" href="index.html">
                    <img src="img/back-arrow.png" class="back-arrow-img" alt="back-arrow-img">
                </a>
            </div>
            <h1>Your informations on Djangobook</h1>
        </div>
    </header>
    <div class="content">
        <div class="settings-container">
            <div class="sub-settings-container">
               <form>
                   <label class="settings-label">
                       <span class="settings-name">First Name</span>
                       <input type="text" placeholder="First Name" class="input-text">
                   </label>
                   <label class="settings-label">
                       <span class="settings-name">Second Name</span>
                       <input type="text" placeholder="Second Name" class="input-text">
                   </label>
                   <h2>Profile Picture</h2>
                   <label class="settings-label">
                       <span class="settings-name">Location</span>
                       <input type="text" placeholder="Location" class="input-text">
                   </label>
               </form>
            </div>
        </div>
    </div>
</body>
</html>
